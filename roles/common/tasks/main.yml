---
# =============================================================================
# Role: common
# Target: All Kubernetes Nodes (Master & Workers)
# Purpose: Idempotent OS tuning, swap disabling, kernel networking modules,
#          containerd runtime setup, and pinned Kubernetes v1.31 binaries.
# =============================================================================

- name: Wait for SSM connection to be established
  ansible.builtin.wait_for_connection:
    timeout: 120

- name: Gather facts if not already gathered
  ansible.builtin.setup:
    gather_subset:
      - network
      - hardware

# -----------------------------------------------------------------------------
# 1. Swap Disabling (Mandatory for Kubernetes kubelet stability)
# -----------------------------------------------------------------------------
- name: Check if swap is currently active
  ansible.builtin.command: swapon --show
  register: swapon_output
  changed_when: false

- name: Disable swap immediately if active
  ansible.builtin.command: swapoff -a
  when: swapon_output.stdout != ""
  changed_when: true

- name: Permanently remove/comment out swap entries in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\s]+\s+[^#\s]+\s+swap\s+.*)$'
    replace: '# \1'

# -----------------------------------------------------------------------------
# 2. Kernel Modules Configuration (overlay & br_netfilter)
# -----------------------------------------------------------------------------
- name: Ensure /etc/modules-load.d directory exists
  ansible.builtin.file:
    path: /etc/modules-load.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Persist required Kubernetes kernel modules in /etc/modules-load.d/k8s.conf
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    owner: root
    group: root
    mode: '0644'

- name: Load overlay kernel module
  community.general.modprobe:
    name: overlay
    state: present

- name: Load br_netfilter kernel module
  community.general.modprobe:
    name: br_netfilter
    state: present

# -----------------------------------------------------------------------------
# 3. Sysctl Networking Configuration
# -----------------------------------------------------------------------------
- name: Configure sysctl parameters for Kubernetes networking
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/k8s.conf
    state: present
    reload: true
  loop:
    - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
    - { name: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
    - { name: 'net.ipv4.ip_forward', value: '1' }

# -----------------------------------------------------------------------------
# 4. Package Prerequisites & containerd Runtime Installation
# -----------------------------------------------------------------------------
- name: Install prerequisite packages for repository and container runtime
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - software-properties-common
    state: present
    update_cache: true
    cache_valid_time: "{{ apt_cache_valid_time }}"
    lock_timeout: "{{ apt_lock_timeout }}"

- name: Install containerd package
  ansible.builtin.apt:
    name: containerd
    state: present
    lock_timeout: "{{ apt_lock_timeout }}"

- name: Ensure /etc/containerd directory exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Check if containerd config.toml exists
  ansible.builtin.stat:
    path: /etc/containerd/config.toml
  register: containerd_config_stat

- name: Generate default containerd configuration if missing
  ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
  when: not containerd_config_stat.stat.exists or containerd_config_stat.stat.size == 0
  notify: Restart containerd

- name: Ensure SystemdCgroup = true in containerd config.toml
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: '(\s*SystemdCgroup\s*=\s*)false'
    replace: '\1true'
  notify: Restart containerd

- name: Flush handlers to ensure containerd is running with systemd cgroups
  ansible.builtin.meta: flush_handlers

- name: Ensure containerd service is enabled and started
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true

# -----------------------------------------------------------------------------
# 5. Kubernetes v1.31 APT Repository & Binaries Installation
# -----------------------------------------------------------------------------
- name: Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Check if Kubernetes APT signing key exists
  ansible.builtin.stat:
    path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  register: k8s_keyring_stat

- name: Download and de-armor Kubernetes v1.31 signing key
  ansible.builtin.shell: |
    curl -fsSL {{ k8s_apt_key_url }} | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  when: not k8s_keyring_stat.stat.exists
  changed_when: true

- name: Set correct permissions on Kubernetes APT keyring
  ansible.builtin.file:
    path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    owner: root
    group: root
    mode: '0644'

- name: Add official Kubernetes v1.31 APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    content: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] {{ k8s_apt_repo_url }} /\n"
    owner: root
    group: root
    mode: '0644'

- name: Install kubelet, kubeadm, and kubectl packages
  ansible.builtin.apt:
    name: "{{ k8s_packages }}"
    state: present
    update_cache: true
    lock_timeout: "{{ apt_lock_timeout }}"

- name: Pin Kubernetes packages with apt-mark hold
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ k8s_packages }}"

- name: Ensure kubelet service is enabled
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
