name: Stage 2 - Kubernetes Ansible Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - '**.yml'
      - '**.yaml'
      - '**.cfg'
      - '**.j2'
      - 'requirements.txt'
      - '.github/workflows/stage2-ansible.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap-kubernetes:
    name: Bootstrap Kubernetes Cluster over AWS SSM
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout Source Code
      # -----------------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Authenticate to AWS via OIDC
      # -----------------------------------------------------------------------
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2
          audience: sts.amazonaws.com

      # -----------------------------------------------------------------------
      # 3. Install AWS Session Manager Plugin (Required for community.aws.aws_ssm)
      # -----------------------------------------------------------------------
      - name: Install AWS Session Manager Plugin
        run: |
          echo "Installing AWS Session Manager CLI plugin..."
          curl -fsSL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "session-manager-plugin.deb"
          sudo dpkg -i session-manager-plugin.deb
          session-manager-plugin --version
          rm -f session-manager-plugin.deb

      # -----------------------------------------------------------------------
      # 4. Set up Python Environment
      # -----------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # -----------------------------------------------------------------------
      # 5. Install Python Dependencies
      # -----------------------------------------------------------------------
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------------------------------------------------
      # 6. Install Ansible Galaxy Collections
      # -----------------------------------------------------------------------
      - name: Install Ansible Galaxy Collections
        run: |
          ansible-galaxy collection install -r requirements.yml --force

      # -----------------------------------------------------------------------
      # 7. Playbook Syntax Check
      # -----------------------------------------------------------------------
      - name: Ansible Syntax Check
        run: |
          ansible-playbook --syntax-check site.yml

      # -----------------------------------------------------------------------
      # 8. Dynamic Inventory Resolution & Graph Verification
      # -----------------------------------------------------------------------
      - name: Verify EC2 Dynamic Inventory Graph
        run: |
          ansible-inventory -i inventory/aws_ec2.yml --graph
          ansible-inventory -i inventory/aws_ec2.yml --list

      # -----------------------------------------------------------------------
      # 9. Execute Idempotent Bootstrap Playbook
      # -----------------------------------------------------------------------
      - name: Execute Kubernetes Cluster Bootstrap
        env:
          ANSIBLE_FORCE_COLOR: "True"
        run: |
          ansible-playbook site.yml
